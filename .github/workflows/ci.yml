# The suite a third party can replay: no browser, no mounted encrypted directory.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Referenced by version tag: pin them by full commit hash before any publication.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Tests without a browser
        run: python -m pytest -q -m "not browser"
