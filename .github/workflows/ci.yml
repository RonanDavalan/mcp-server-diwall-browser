# The suite a third party can replay: no browser, no mounted encrypted directory.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Pinned by full commit hash: a tag can be moved, a hash cannot. The comment names the
      # release the hash was read from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Tests without a browser
        run: python -m pytest -q -m "not browser"
