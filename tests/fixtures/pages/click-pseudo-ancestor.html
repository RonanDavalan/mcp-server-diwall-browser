<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>pseudo-ancestor</title>
<style>html,body{margin:0;padding:0} body{height:120vh} button{margin:0;padding:0;border:1px solid #333;background:#eee;font:14px sans-serif;width:140px;height:40px;position:absolute;left:200px;top:200px} #w{position:absolute;left:200px;top:200px;width:140px;height:40px} #w::after{content:"";position:absolute;left:0;top:0;width:140px;height:40px}</style></head>
<body><div id="w"><button style="left:0;top:0;position:absolute">Cible</button></div><script>window.__clicks=0;document.addEventListener('click',function(e){if(e.composedPath().some(function(n){return n.tagName==='BUTTON'})){window.__clicks+=1}},true);</script></body></html>
