<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>overlay-covering</title>
<style>html,body{margin:0;padding:0} body{height:120vh} button{margin:0;padding:0;border:1px solid #333;background:#eee;font:14px sans-serif;width:140px;height:40px;position:absolute;left:200px;top:200px} #o{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:50}</style></head>
<body><button>Cible</button><div id="o"></div><script>window.__clicks=0;document.addEventListener('click',function(e){if(e.composedPath().some(function(n){return n.tagName==='BUTTON'})){window.__clicks+=1}},true);</script></body></html>
