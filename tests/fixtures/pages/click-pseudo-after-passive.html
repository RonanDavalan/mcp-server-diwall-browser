<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>pseudo-after-passive</title>
<style>html,body{margin:0;padding:0} body{height:120vh} button{margin:0;padding:0;border:1px solid #333;background:#eee;font:14px sans-serif;width:140px;height:40px;position:absolute;left:200px;top:200px} button::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}</style></head>
<body><button>Cible</button><script>window.__clicks=0;document.addEventListener('click',function(e){if(e.composedPath().some(function(n){return n.tagName==='BUTTON'})){window.__clicks+=1}},true);</script></body></html>
