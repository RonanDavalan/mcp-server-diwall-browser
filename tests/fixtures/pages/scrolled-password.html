<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrolled password page</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  /* Tall enough that the field is far below the top of the page at every zoom. */
  #above { height: 1800px; padding: 16px; box-sizing: border-box; }
  #below { height: 1800px; }
  /* A block of a colour that is nothing else on the page: its place in an image shows which part of the page the image is. */
  #landmark { width: 120px; height: 40px; margin: 0 0 30px 20px; background: rgb(10, 160, 10); }
  /* Near the right edge of the view, where a ratio that is a little too small moves a box most. */
  form { margin: 0; padding-right: 24px; text-align: right; }
  #password { width: 220px; height: 28px; margin: 0; padding: 0 4px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="above"><h1>Scrolled password page</h1><p>A local page served by the tests. Nothing here is real.</p></div>
<div id="landmark"></div>
<form id="sign-in" action="/signed-in" method="post">
  <input id="password" name="password" type="password" aria-label="Password">
</form>
<div id="below"></div>
<script>
  document.getElementById("password").value = "not-a-real-password";
  document.getElementById("sign-in").addEventListener("submit", function (event) { event.preventDefault(); });
</script>
</body>
</html>
